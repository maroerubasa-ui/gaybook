<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story Journal Library</title>
    <style>
        :root {
            --bg-dark: #0f0e17;
            --card-dark: #16161a;
            --text-main: #fffffe;
            --text-muted: #a7a9be;
            --accent: #ff8906;
            --highlight: rgba(255, 137, 6, 0.15);
            --sidebar-width: 280px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* Sidebar modified to slide over content */
        aside {
            width: var(--sidebar-width);
            background: #12111a;
            border-right: 1px solid #222;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 1002;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        aside.open {
            transform: translateX(0);
        }

        /* Backdrop overlay when sidebar is open */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 1001;
            display: none;
        }

        .sidebar-overlay.visible {
            display: block;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #222;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .new-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            width: auto;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .story-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .story-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .story-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .story-item.active-story {
            background: var(--highlight);
            color: var(--text-main);
            border-left: 3px solid var(--accent);
        }

        .delete-story-btn {
            background: transparent;
            color: #ff477e;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .delete-story-btn:hover { opacity: 1; }

        /* Content width completely restored */
        .content-wrapper {
            margin-left: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            background: rgba(15, 14, 23, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #222;
            z-index: 1000;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Floating open trigger for Library panel */
        .menu-trigger-btn {
            position: absolute;
            left: 20px;
            top: 14px;
            background: #16161a;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            font-weight: normal;
        }
        .menu-trigger-btn:hover {
            border-color: var(--accent);
        }

        .progress-container {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .timeline-track {
            position: relative;
            width: 85%;
            height: 10px;
            background: #222;
            margin: 0 auto;
            border-radius: 5px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 5px 0 0 5px;
            transition: width 0.1s ease-out;
        }

        .comment-marker {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background: #ff477e;
            box-shadow: 0 0 8px #ff477e;
            cursor: pointer;
            transform: translateX(-50%);
        }

        main {
            max-width: 680px;
            width: 90%;
            margin-top: 120px;
            margin-bottom: 180px;
        }

        .setup-box {
            background: var(--card-dark);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            background: #242629;
            color: var(--text-main);
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #242629;
            color: var(--text-main);
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }

        #story-area p {
            line-height: 1.8;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        #story-area p:hover { background: rgba(255, 255, 255, 0.03); }
        #story-area p.active {
            color: var(--text-main);
            background: var(--highlight);
            box-shadow: -4px 0 0 var(--accent);
            border-radius: 0 6px 6px 0;
        }

        .comment-display {
            background: #2e2f3e;
            color: #fffffe;
            padding: 12px 16px;
            border-left: 4px solid #ff477e;
            margin-top: -1.5rem;
            margin-bottom: 2.5rem;
            border-radius: 0 6px 6px 0;
            font-size: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Backdrop Dimmer Elements -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar Library -->
    <aside id="library-sidebar">
        <div class="sidebar-header">
            <span>📚 Library</span>
            <div class="header-actions">
                <button class="new-btn" onclick="showSetupNewStory()">+ New</button>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">✕</button>
            </div>
        </div>
        <div class="story-list" id="story-list-container">
            <!-- Saved stories will list here dynamically -->
        </div>
    </aside>

    <!-- Main Workspace -->
    <div class="content-wrapper">
        <header>
            <button class="menu-trigger-btn" onclick="toggleSidebar(true)">☰ Library</button>
            <div class="progress-container">READING PROGRESS: <span id="progress-percent">0%</span></div>
            <div class="timeline-track" id="track-container">
                <div class="progress-fill" id="myBar"></div>
            </div>
        </header>

        <main>
            <div id="setup-view" class="setup-box">
                <h2 style="margin-top: 0; color: var(--accent);">Load Story Journal 📖</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Give your story a title and paste the text below.</p>
                <input type="text" id="story-title" placeholder="Story Title (e.g., Chapter 1, Sci-Fi Short Story)">
                <textarea id="text-input" placeholder="Paste text content here..."></textarea>
                <button onclick="createNewStory()">Initialize Story Reader</button>
            </div>

            <div id="story-area"></div>
        </main>
    </div>

    <script>
        let library = { currentActiveId: null, stories: {} };
        let totalParagraphs = 0;
        let isInitialAutoscroll = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedLibrary = localStorage.getItem('journal_library');
            if (savedLibrary) {
                library = JSON.parse(savedLibrary);
                renderSidebar();
                
                if (library.currentActiveId && library.stories[library.currentActiveId]) {
                    loadStory(library.currentActiveId);
                } else {
                    showSetupNewStory();
                }
            } else {
                showSetupNewStory();
            }
        });

        // Sliding Panel Toggle Mechanics
        function toggleSidebar(shouldOpen) {
            const sidebar = document.getElementById('library-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (shouldOpen) {
                sidebar.classList.add('open');
                overlay.classList.add('visible');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('visible');
            }
        }

        function renderSidebar() {
            const container = document.getElementById('story-list-container');
            container.innerHTML = '';
            
            Object.keys(library.stories).forEach(id => {
                const story = library.stories[id];
                const item = document.createElement('div');
                item.className = `story-item ${id === library.currentActiveId ? 'active-story' : ''}`;
                item.onclick = () => {
                    loadStory(id);
                    toggleSidebar(false); // Auto close panel upon choosing a book
                };

                const titleSpan = document.createElement('span');
                titleSpan.textContent = story.title || "Untitled Story";
                titleSpan.style.overflow = "hidden";
                titleSpan.style.textOverflow = "ellipsis";
                titleSpan.style.whiteSpace = "nowrap";
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-story-btn';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteStory(id);
                };

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                container.appendChild(item);
            });
        }

        function showSetupNewStory() {
            library.currentActiveId = null;
            saveLibraryToStorage();
            renderSidebar();

            document.getElementById('story-area').innerHTML = '';
            document.getElementById('story-title').value = '';
            document.getElementById('text-input').value = '';
            document.getElementById('setup-view').style.display = 'block';
            document.getElementById("myBar").style.width = "0%";
            document.getElementById("progress-percent").textContent = "0%";
            document.querySelectorAll('.comment-marker').forEach(m => m.remove());
            toggleSidebar(false);
        }

        function createNewStory() {
            const title = document.getElementById('story-title').value.trim() || "Untitled Story";
            const rawText = document.getElementById('text-input').value.trim();
            if (!rawText) return alert("Please paste text data first.");

            const newId = Date.now().toString();
            
            library.stories[newId] = {
                title: title,
                text: rawText,
                comments: {},
                lastIdx: 0
            };
            library.currentActiveId = newId;
            
            saveLibraryToStorage();
            renderSidebar();
            loadStory(newId);
        }

        function loadStory(id) {
            library.currentActiveId = id;
            saveLibraryToStorage();
            renderSidebar();

            const story = library.stories[id];
            document.getElementById('setup-view').style.display = 'none';
            
            const area = document.getElementById('story-area');
            area.innerHTML = '';

            const paragraphs = story.text.split(/\n\s*\n/);
            totalParagraphs = paragraphs.length;

            paragraphs.forEach((pText, idx) => {
                if (pText.trim() === '') return;

                const p = document.createElement('p');
                p.textContent = pText;
                p.dataset.index = idx;
                p.addEventListener('click', () => promptForComment(idx));
                area.appendChild(p);

                if (story.comments[idx]) {
                    renderCommentNode(idx, story.comments[idx]);
                }
            });

            window.removeEventListener('scroll', handleScroll);
            window.addEventListener('scroll', handleScroll);
            
            renderAllMarkers();

            if (story.lastIdx) {
                isInitialAutoscroll = true;
                setTimeout(() => {
                    const targetPara = document.querySelector(`p[data-index="${story.lastIdx}"]`);
                    if (targetPara) {
                        targetPara.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                    isInitialAutoscroll = false;
                }, 350);
            }
        }

        function handleScroll() {
            if (isInitialAutoscroll || !library.currentActiveId) return;

            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? Math.round((winScroll / height) * 100) : 0;
            
            document.getElementById("myBar").style.width = scrolled + "%";
            document.getElementById("progress-percent").textContent = scrolled + "%";

            const paras = document.querySelectorAll('#story-area > p');
            const centerLine = window.innerHeight / 2;
            const activeStory = library.stories[library.currentActiveId];

            paras.forEach(p => {
                const rect = p.getBoundingClientRect();
                if (rect.top < centerLine && rect.bottom > centerLine) {
                    const idx = parseInt(p.dataset.index);
                    if (activeStory.lastIdx !== idx) {
                        paras.forEach(el => el.classList.remove('active'));
                        p.classList.add('active');
                        activeStory.lastIdx = idx;
                        saveLibraryToStorage();
                    }
                }
            });
        }

        function promptForComment(idx) {
            const activeStory = library.stories[library.currentActiveId];
            const existingText = activeStory.comments[idx] || "";
            const userComment = prompt("Add your commentary/gossip to this scene:", existingText);
            
            if (userComment === null) return; 

            if (userComment.trim() === "") {
                delete activeStory.comments[idx];
                removeCommentNode(idx);
            } else {
                activeStory.comments[idx] = userComment;
                renderCommentNode(idx, userComment);
            }

            saveLibraryToStorage();
            renderAllMarkers();
        }

        function renderCommentNode(idx, text) {
            removeCommentNode(idx);
            const paraNode = document.querySelector(`p[data-index="${idx}"]`);
            if (paraNode) {
                const commBlock = document.createElement('div');
                commBlock.className = 'comment-display';
                commBlock.id = `comment-block-${idx}`;
                commBlock.innerHTML = `<strong>My Commentary:</strong> "${text}"`;
                paraNode.parentNode.insertBefore(commBlock, paraNode.nextSibling);
            }
        }

        function removeCommentNode(idx) {
            const block = document.getElementById(`comment-block-${idx}`);
            if (block) block.remove();
        }

        function renderAllMarkers() {
            const track = document.getElementById('track-container');
            document.querySelectorAll('.comment-marker').forEach(m => m.remove());

            if (!library.currentActiveId) return;
            const activeStory = library.stories[library.currentActiveId];

            Object.keys(activeStory.comments).forEach(idx => {
                const positionPct = ((parseInt(idx) + 1) / totalParagraphs) * 100;
                
                const marker = document.createElement('div');
                marker.className = 'comment-marker';
                marker.style.left = `${positionPct}%`;
                marker.title = `Comment at segment ${Math.round(positionPct)}%`;
                
                marker.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const targetPara = document.querySelector(`p[data-index="${idx}"]`);
                    if (targetPara) {
                        targetPara.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                });

                track.appendChild(marker);
            });
        }

        function deleteStory(id) {
            if (!confirm("Are you sure you want to delete this story and all its comments?")) return;
            
            delete library.stories[id];
            if (library.currentActiveId === id) {
                const remainingIds = Object.keys(library.stories);
                library.currentActiveId = remainingIds.length > 0 ? remainingIds[0] : null;
            }
            
            saveLibraryToStorage();
            renderSidebar();

            if (library.currentActiveId) {
                loadStory(library.currentActiveId);
            } else {
                showSetupNewStory();
            }
        }

        function saveLibraryToStorage() {
            localStorage.setItem('journal_library', JSON.stringify(library));
        }
    </script>
</body>
</html>
